# Hekla intake — multi-tenant Worker. Secrets are NOT stored here.
#   wrangler secret put AIRTABLE_API_KEY
#   wrangler secret put CLERK_SECRET_KEY      (sign-in; users and organizations live in Clerk)
#   wrangler secret put DATABASE_URL          (Neon Postgres; tenants and audit log, see db/migrations)
# Optional:
#   wrangler secret put AIRTABLE_PAT          (used if AIRTABLE_API_KEY is unset)
#   wrangler secret put GEMINI_API_KEY        (AI rank adjustment; rules-only without it)
# Each tenant's Airtable base, table and bot webhook are rows in the Neon tenants table, not vars.

name = "hekla-intake"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1


[vars]
# Public by design (it ships to the browser). Paste the key from Clerk dashboard > API keys.
CLERK_PUBLISHABLE_KEY = "pk_test_Y3V0ZS1nYXItNzgwMi5jbGVyay5hY2NvdW50cy5kZXYk"
# Clerk user IDs (comma-separated) allowed into /admin, where plans are granted. Not an organization role.
PLATFORM_ADMIN_USER_IDS = "user_3KYHxnl1WPPJkOIR8PQhr8gzOxD"
