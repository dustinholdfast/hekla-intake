# Hekla intake — multi-tenant Worker. Secrets are NOT stored here.
#   wrangler secret put AIRTABLE_API_KEY
#   wrangler secret put CLERK_SECRET_KEY      (sign-in; users and organizations live in Clerk)
#   wrangler secret put DATABASE_URL          (Neon Postgres; tenants and audit log, see db/migrations)
# Optional:
#   wrangler secret put AIRTABLE_PAT          (used if AIRTABLE_API_KEY is unset)
#   wrangler secret put GEMINI_API_KEY        (AI rank adjustment; rules-only without it)
# Each tenant's Airtable base, table and bot webhook are rows in the Neon tenants table, not vars.

name = "hekla-intake"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
# One trigger. Every 5 min: sales (CardTrader order poll + Hekla decrements, the reconcile on :00/:15/:30/:45, the
# optional TCGplayer email at 9 AM America/New_York; each off until its var below is set). Every 10th minute it also
# runs enrichment. Do not add a separate "*/10": Cloudflare fires only one trigger in a minute where two match.
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1


[vars]
# Public by design (it ships to the browser). Paste the key from Clerk dashboard > API keys.
CLERK_PUBLISHABLE_KEY = "pk_test_Y3V0ZS1nYXItNzgwMi5jbGVyay5hY2NvdW50cy5kZXYk"
# Clerk user IDs (comma-separated) allowed into /admin, where plans are granted. Not an organization role.
PLATFORM_ADMIN_USER_IDS = "user_3KYHxnl1WPPJkOIR8PQhr8gzOxD"

# Sales log and cross-delist (docs/SALES-SYNC.md). All off by default.
# CT_SALES_MODE: off | log (record CardTrader sales only) | decrement (also lower the shared Airtable Qty for
#   CardTrader sales paid at or after CT_DECREMENT_FROM; starfoil-lgs needs CT_DECREMENT_UNTIL = the same instant).
CT_SALES_MODE = "log"
CT_DECREMENT_FROM = ""
# RECONCILE_MODE: off | report | push (push only ever lowers a CardTrader listing that shows more than the shared Qty).
RECONCILE_MODE = "off"
# TCGPLAYER_DAILY_EMAIL: off | on (needs alert email set up on Settings).
TCGPLAYER_DAILY_EMAIL = "off"
